<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <!-- Google Consent Mode v2 — se inicializa inline (necesario antes de
         cargar GA). El script de gtag.js se carga diferido tras el LCP para
         no penalizar el First Contentful Paint. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      // Default: storage denegado hasta que el usuario acepte en el banner.
      // wait_for_update da 500ms al banner para resolver antes de disparar pings.
      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied",
        wait_for_update: 500,
      });
      // Reaplica el consentimiento previo (si existe) antes de cargar GA, para
      // que el primer page_view ya respete la elección guardada del usuario.
      try {
        var prev = localStorage.getItem("atep_cookie_consent_v1");
        if (prev === "granted") {
          gtag("consent", "update", {
            ad_storage: "granted",
            ad_user_data: "granted",
            ad_personalization: "granted",
            analytics_storage: "granted",
          });
        }
      } catch (e) {
        /* localStorage indisponible: arrancamos en denied */
      }
      gtag("js", new Date());
      gtag("config", "G-GDE5LM5ND1");

      // Carga diferida del script de GA: esperamos al evento load (LCP ya
      // pintado) o a la primera interacción del usuario, lo que ocurra antes.
      // Reduce el coste de JS de tercera parte durante el critical path móvil.
      (function loadGA() {
        var loaded = false;
        function inject() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement("script");
          s.async = true;
          s.src = "https://www.googletagmanager.com/gtag/js?id=G-GDE5LM5ND1";
          document.head.appendChild(s);
        }
        ["pointerdown", "keydown", "touchstart", "scroll", "mousemove"].forEach(
          function (ev) {
            window.addEventListener(ev, inject, { once: true, passive: true });
          },
        );
        // Respaldo: si nadie interactúa se carga igualmente a los 5s, con la
        // página ya interactiva. Así no se pierden las visitas que rebotan
        // sin tocar nada, y el script (170KB) no compite con el contenido.
        setTimeout(inject, 5000);
      })();
    </script>

    <!-- Favicon. El SVG lo prefieren los navegadores por nitidez, pero se
         mantiene el .ico y los .png porque no todos los consumidores del
         icono aceptan SVG (Google entre ellos, según sus propias guías, pide
         un cuadrado de 48 o múltiplo). Se generan con scripts/generate-icons.cjs. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/new-logo-atep.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Título fallback pre-hidratación. El resto de metas (description,
         OG, Twitter, canonical, JSON-LD) las gestiona SEO.jsx por ruta vía
         react-helmet-async: NO duplicarlas aquí en estático, porque los
         crawlers toman el primer tag del documento (auditoría SEO 2026). -->
    <title>ATEP Consulting | Consultoría IT y Desarrollo de Software</title>
    <meta name="author" content="ATEP Consulting" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#9f1239" />

    <!-- Performance -->
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://api.emailjs.com" />

    <!-- Preload de la imagen LCP (hero) — se sirve la variante AVIF
         responsive más liviana que coincida con el viewport. -->
    <link
      rel="preload"
      as="image"
      href="/images/home/ExpertTeam-768.avif"
      imagesrcset="/images/home/ExpertTeam-480.avif 480w, /images/home/ExpertTeam-768.avif 768w, /images/home/ExpertTeam-1200.avif 1200w"
      imagesizes="(max-width: 820px) 100vw, 40vw"
      type="image/avif"
      fetchpriority="high"
    />

    <style>
      .grecaptcha-badge {
        visibility: hidden !important;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
